<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
        {{title}}
        {% else %}
        Cardsly
        {% endif %}
    </title>

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'main/css/styles.css' %}" />

    <!--Animate.css Link-->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!--Bootstrap Link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

    <!--Font Links-->
    <link rel="preconnect" href="https://fonts.gstatic.com"> 
    <link href="https://fonts.googleapis.com/css2?family=Courgette&display=swap" rel="stylesheet">

</head>
<body>
    <div class="custom-navbar">
        <a href="/"><h1>Cardsly</h1></a>
    </div>
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{message.tags}}{% endif %}" style="margin: auto 30px; max-width: 500px">
        <!-- <a class="close" href="#" data-dismiss="alert">×</a> -->

        {{ message }}

    </div>
    {% endfor %}
    <div class="contain">
        {% block main %}
        
        {% endblock %}
    </div>

    <!--jQuery Link-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="{% static 'main/script/scripts.js' %}"></script>
    <script src="{% static 'main/script/scroll.js' %}"></script>
</body>
</html>
